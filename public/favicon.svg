<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Ícono de Estante: cuatro libros sobre una repisa, uno recostado. scripts/icons.ts genera los PNG. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2758"/>
      <stop offset="0.55" stop-color="#16142e"/>
      <stop offset="1" stop-color="#0a0913"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5296"/>
      <stop offset="1" stop-color="#2c2856"/>
    </linearGradient>
  </defs>
  <rect class="bg" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <g id="art" transform="translate(0 0)">
    <ellipse cx="512" cy="748" rx="330" ry="26" fill="#000" opacity="0.35"/>
    <!-- Libro ámbar -->
    <rect x="250" y="338" width="104" height="386" rx="12" fill="#e9b45f"/>
    <rect x="250" y="338" width="104" height="386" rx="12" fill="url(#shine)"/>
    <rect x="250" y="392" width="104" height="14" fill="#9c6a22" opacity="0.55"/>
    <rect x="250" y="642" width="104" height="14" fill="#9c6a22" opacity="0.55"/>
    <rect x="282" y="450" width="40" height="120" rx="6" fill="#fff6e4" opacity="0.85"/>
    <!-- Libro papel -->
    <rect x="364" y="282" width="86" height="442" rx="12" fill="#f3eee3"/>
    <rect x="364" y="282" width="86" height="442" rx="12" fill="url(#shine)"/>
    <rect x="364" y="336" width="86" height="10" fill="#b9ae96"/>
    <rect x="364" y="356" width="86" height="4" fill="#b9ae96"/>
    <rect x="364" y="664" width="86" height="10" fill="#b9ae96"/>
    <path d="M392 282 h28 v120 l-14 -16 l-14 16 z" fill="#d9645a"/>
    <!-- Libro azul -->
    <rect x="460" y="370" width="112" height="354" rx="12" fill="#6d86ff"/>
    <rect x="460" y="370" width="112" height="354" rx="12" fill="url(#shine)"/>
    <rect x="460" y="420" width="112" height="16" fill="#3b4dbf" opacity="0.7"/>
    <rect x="460" y="652" width="112" height="16" fill="#3b4dbf" opacity="0.7"/>
    <rect x="494" y="476" width="44" height="8" rx="4" fill="#e6ebff"/>
    <rect x="494" y="494" width="44" height="8" rx="4" fill="#e6ebff" opacity="0.7"/>
    <!-- Libro rojo recostado -->
    <g transform="rotate(-16 688 724)">
      <rect x="688" y="314" width="92" height="410" rx="12" fill="#d9645a"/>
      <rect x="688" y="314" width="92" height="410" rx="12" fill="url(#shine)"/>
      <rect x="688" y="366" width="92" height="12" fill="#8f2f27" opacity="0.6"/>
      <rect x="688" y="660" width="92" height="12" fill="#8f2f27" opacity="0.6"/>
      <rect x="714" y="430" width="40" height="150" rx="6" fill="#ffe2d6" opacity="0.8"/>
    </g>
    <!-- Repisa -->
    <rect x="186" y="722" width="652" height="30" rx="15" fill="url(#shelf)"/>
    <rect x="200" y="724" width="624" height="5" rx="2.5" fill="#ffffff" opacity="0.22"/>
  </g>
</svg>
